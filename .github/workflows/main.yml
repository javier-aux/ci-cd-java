on:
  push:
    branches:
    - main
jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: copiar codigo
        uses: actions/checkout@v4
      - name: ejecutando test
        run: mvn clean test
    
    


  build:
    runs-on: self-hosted
    steps:
      - name: copiar codigo
        uses: actions/checkout@v4
      - name: construyendo imagenes
        run: docker compose build --no-cache


  deploy:
    runs-on: self-hosted
    steps:
      - name: copiar codigo
        uses: actions/checkout@v4
      - name: construyendo contenedores
        run: | 
         docker compose down -v --rmi all || true
         docker compose up -d

  
  
